<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>"/>
  <title>Sign In — DLS Arena</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body class="football-bg">
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">⚽ DLS <span>Arena</span></div>

    <div id="authError" class="auth-error hidden"></div>

    <!-- TABS -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin"    onclick="showTab('login')">Sign In</button>
      <button class="auth-tab"        id="tabRegister" onclick="showTab('register')">Register</button>
    </div>

    <!-- LOGIN -->
    <div id="formLogin">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" id="loginEmail" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative">
          <input class="form-input" type="password" id="loginPass" placeholder="••••••••" style="padding-right:42px"/>
          <button type="button" onclick="togglePw('loginPass',this)" class="pw-eye">👁</button>
        </div>
      </div>
      <button class="btn btn-primary btn-full" onclick="doLogin()" id="loginBtn">Sign In</button>
      <div style="text-align:center;margin-top:12px">
  <a href="#" onclick="showForgotPassword()" style="font-size:12px;color:var(--muted)">Forgot password?</a>
</div>
    </div>

    <!-- REGISTER -->
    <div id="formRegister" class="hidden">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input class="form-input" type="text" id="regName" placeholder="Your name"/>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" id="regEmail" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative">
          <input class="form-input" type="password" id="regPass" placeholder="Min. 6 characters" style="padding-right:42px"/>
          <button type="button" onclick="togglePw('regPass',this)" class="pw-eye">👁</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <div style="position:relative">
          <input class="form-input" type="password" id="regConfirm" placeholder="Repeat password" style="padding-right:42px"/>
          <button type="button" onclick="togglePw('regConfirm',this)" class="pw-eye">👁</button>
        </div>
      </div>
      <button class="btn btn-primary btn-full" onclick="doRegister()" id="registerBtn">Create Account</button>
    </div>

  </div>
</div>

<style>
.pw-eye {
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  background:none; border:none; cursor:pointer; color:var(--muted);
  font-size:18px; padding:0; line-height:1;
}
</style>

<script src="/js/api.js"></script>
<script>
  // Redirect if already logged in
  const _u = getUser();
  if (_u?.is_admin) window.location.href = '/admin.html';
  else if (_u) window.location.href = '/dashboard.html';

  // Show register tab if #register in URL
  if (window.location.hash === '#register') showTab('register');

  function showTab(t) {
    document.getElementById('formLogin').classList.toggle('hidden', t !== 'login');
    document.getElementById('formRegister').classList.toggle('hidden', t !== 'register');
    document.getElementById('tabLogin').classList.toggle('active', t === 'login');
    document.getElementById('tabRegister').classList.toggle('active', t === 'register');
    hideError();
  }

  function showError(msg) {
    const el = document.getElementById('authError');
    el.textContent = '⚠ ' + msg;
    el.classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function hideError() {
    document.getElementById('authError').classList.add('hidden');
  }

  function togglePw(id, btn) {
    const input = document.getElementById(id);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    btn.textContent = isHidden ? '🙈' : '👁';
  }

  async function doLogin() {
    hideError();
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value;
    if (!email || !password) return showError('Please fill in all fields');
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const data = await API.post('/auth/login', { email, password });
      localStorage.setItem('dls_token', data.token);
      localStorage.setItem('dls_user',  JSON.stringify(data.user));
      window.location.href = '/dashboard.html';
    } catch (e) {
      showError(e.message);
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  }

  async function doRegister() {
    hideError();
    const name     = document.getElementById('regName').value.trim();
    const email    = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPass').value;
    const confirm  = document.getElementById('regConfirm').value;
    if (!name || !email || !password || !confirm) return showError('Please fill in all fields');
    if (password !== confirm) return showError('Passwords do not match');
    if (password.length < 6)  return showError('Password must be at least 6 characters');
    const btn = document.getElementById('registerBtn');
    btn.disabled = true; btn.textContent = 'Creating account…';
    try {
      const data = await API.post('/auth/register', { name, email, password });
      localStorage.setItem('dls_token', data.token);
      localStorage.setItem('dls_user',  JSON.stringify(data.user));
      window.location.href = '/dashboard.html';
    } catch (e) {
      showError(e.message);
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  }
function showForgotPassword() {
    const email = prompt('Enter your registered email:');
    if (!email) return;
    const phone = prompt('Enter your registered phone number:');
    if (!phone) return;
    API.post('/auth/reset-request', { email, phone })
      .then(() => alert('✅ Reset request submitted! Admin will contact you on WhatsApp with a temporary password.'))
      .catch(e => alert('⚠ ' + e.message));
  }
  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (!document.getElementById('formLogin').classList.contains('hidden')) doLogin();
      else doRegister();
    }
  });
</script>
</body>
</html>
